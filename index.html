<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ReparaWey - Gestión de Reparaciones</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>ReparaWey</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-link active" data-view="dashboard"
          ><span>Dashboard</span></a
        >
        <a href="#" class="nav-link" data-view="clients"
          ><span>Clientes</span></a
        >
        <a href="#" class="nav-link" data-view="devices"
          ><span>Dispositivos</span></a
        >
        <a href="#" class="nav-link" data-view="repairs"
          ><span>Reparaciones</span></a
        >
        <a href="#" class="nav-link" data-view="parts"
          ><span>Inventario Piezas</span></a
        >
        <a href="#" class="nav-link" data-view="tools"
          ><span>Inventario Implementos</span></a
        >
      </nav>
    </aside>

    <main class="main-content" id="main-content">
      <!-- Dashboard -->
      <section class="view active" id="view-dashboard">
        <div class="container">
          <h1>Dashboard</h1>
          <div class="stats-grid" id="stats-grid"></div>
          <div class="recent-repairs" id="recent-repairs"></div>
        </div>
      </section>

      <!-- Clients -->
      <section class="view" id="view-clients">
        <div class="container">
          <div class="header-row">
            <h1>Clientes</h1>
            <button class="btn btn-primary" id="btn-add-client">+ Nuevo Cliente</button>
          </div>
          <div class="table-wrapper" id="clients-table"></div>
        </div>
      </section>

      <!-- Devices -->
      <section class="view" id="view-devices">
        <div class="container">
          <div class="header-row">
            <h1>Dispositivos</h1>
            <button class="btn btn-primary" id="btn-add-device">+ Nuevo Dispositivo</button>
          </div>
          <div class="table-wrapper" id="devices-table"></div>
        </div>
      </section>

      <!-- Repairs -->
      <section class="view" id="view-repairs">
        <div class="container">
          <div class="header-row">
            <h1>Reparaciones</h1>
            <button class="btn btn-primary" id="btn-add-repair">+ Nueva Reparación</button>
          </div>
          <div class="table-wrapper" id="repairs-table"></div>
        </div>
      </section>

      <!-- Parts Inventory -->
      <section class="view" id="view-parts">
        <div class="container">
          <div class="header-row">
            <h1>Inventario de Piezas</h1>
            <button class="btn btn-primary" id="btn-add-part">+ Nueva Pieza</button>
          </div>
          <div class="table-wrapper" id="parts-table"></div>
        </div>
      </section>

      <!-- Tools Inventory -->
      <section class="view" id="view-tools">
        <div class="container">
          <div class="header-row">
            <h1>Inventario de Implementos</h1>
            <button class="btn btn-primary" id="btn-add-tool">+ Nuevo Implemento</button>
          </div>
          <div class="table-wrapper" id="tools-table"></div>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal Genérico -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-title"></h3>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
